name: Build Windows Executable

on:
  workflow_dispatch: # <-- Ini memungkinkan Anda klik tombol "Run workflow" secara manual
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    # KUNCI UTAMA: Kita menggunakan runner Windows asli milik GitHub
    runs-on: windows-latest 

    steps:
    - name: Checkout kode dari repository
      uses: actions/checkout@v4

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Cache dependensi Cargo (agar build lebih cepat)
      uses: Swatinem/rust-cache@v2

    - name: Build project untuk Windows
      run: cargo build --release

    - name: Upload file .exe sebagai Artifact
      uses: actions/upload-artifact@v4
      with:
        name: text-expander-windows
        path: target/release/text-expander.exe
        retention-days: 7 # File akan disimpan di GitHub selama 7 hari untuk Anda download
